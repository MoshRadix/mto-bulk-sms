<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/png" sizes="256x256" href="./assets/addu-city-icon.png" />
		<link rel="apple-touch-icon" href="./assets/addu-city-icon.png" />
		<title>MTO Bulk SMS Manager</title>
		<style>
			@font-face {
				font-family: "Inter";
				src: url("./assets/Inter-VariableFont_opsz,wght.ttf") format("truetype");
				font-style: normal;
				font-weight: 100 900;
				font-display: swap;
			}
			:root { color-scheme: dark; font-family: "Inter", "Segoe UI", sans-serif; background: #091320; color: #ebf2ff; }
			* { box-sizing: border-box; }
			html, body, #root { min-height: 100%; margin: 0; }
			@property --rain-angle { syntax: "<angle>"; inherits: false; initial-value: 108deg; }
			body::before { --rain-angle: 108deg; content: ""; position: fixed; inset: -120px -80px; z-index: 0; pointer-events: none; opacity: 0.12; background-image: repeating-linear-gradient(var(--rain-angle), transparent 0 38px, rgba(186, 230, 253, 0.34) 39px, transparent 41px 82px), repeating-linear-gradient(var(--rain-angle), transparent 0 73px, rgba(125, 211, 252, 0.2) 74px, transparent 76px 146px); background-size: 92px 110px, 158px 180px; background-position: 0 0, 0 0; animation: boot-rain-flow 60s ease-in-out infinite, boot-rain-intensity 42s ease-in-out infinite; }
			body::after { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 72% 8%, rgba(219, 244, 255, 0.28), transparent 32%), linear-gradient(112deg, transparent 0 68%, rgba(186, 230, 253, 0.1) 68.2%, transparent 69%); animation: boot-lightning 24s ease-in-out infinite; }
			#root { position: relative; z-index: 1; }
			@keyframes boot-rain-flow { 0% { --rain-angle: 108deg; background-position: 0 0, 0 0; } 18% { --rain-angle: 111deg; background-position: -42px 80px, -74px 132px; } 47% { --rain-angle: 118deg; background-position: -92px 220px, -158px 360px; } 76% { --rain-angle: 101deg; background-position: -34px 330px, -72px 540px; } 100% { --rain-angle: 108deg; background-position: 0 440px, 0 720px; } }
			@keyframes boot-rain-intensity { 0%, 100% { opacity: 0.08; } 28% { opacity: 0.13; } 55% { opacity: 0.17; } 78% { opacity: 0.11; } }
			@keyframes boot-lightning { 0%, 87%, 90%, 93%, 100% { opacity: 0; } 88% { opacity: 0.22; } 89% { opacity: 0.04; } 91% { opacity: 0.14; } 92% { opacity: 0.02; } }
			.boot-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at center, #102435 0%, #091320 58%, #06101a 100%); }
			.boot-content { display: grid; justify-items: center; gap: 20px; text-align: center; }
			.boot-spinner { width: 42px; height: 42px; border: 2px solid rgba(34, 211, 238, 0.22); border-top-color: #22d3ee; border-right-color: #3b82f6; border-radius: 50%; animation: boot-spin 0.9s linear infinite; box-shadow: 0 0 20px rgba(34, 211, 238, 0.14); }
			.boot-title { margin: 0; font-size: 1rem; font-weight: 650; }
			.boot-caption { margin: 7px 0 0; color: #9fb3c8; font-size: 0.82rem; }
			.boot-caption::after { content: ''; display: inline-block; width: 16px; text-align: left; animation: boot-dots 1.4s steps(4, end) infinite; }
			@keyframes boot-spin { to { transform: rotate(360deg); } }
			@keyframes boot-dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75%, 100% { content: '...'; } }
			@media (prefers-reduced-motion: reduce) {
				.boot-spinner, .boot-caption::after { animation: none; }
				.boot-spinner { border-top-color: #22d3ee; }
			}
		</style>
	</head>
	<body>
		<div id="root">
			<main class="boot-screen" role="status" aria-live="polite">
				<div class="boot-content">
					<span class="boot-spinner" aria-hidden="true"></span>
					<div>
						<p class="boot-title">Starting MTO Bulk SMS Manager</p>
						<p class="boot-caption">Preparing your workspace</p>
					</div>
				</div>
			</main>
		</div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
